<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TropMed Ward 14 Portal</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- ==================== หน้า 1: เมนูแอปทั้งหมด (MAIN HUB) ==================== -->
  <div id="page-app-launcher" class="max-w-md mx-auto p-4">
    <!-- Header -->
    <div class="mb-6 pt-4">
      <h1 class="text-2xl font-bold text-slate-800">TropMed Ward 14</h1>
      <p class="text-sm text-slate-500">เลือกบริการหรือแอปพลิเคชันที่ต้องการใช้งาน</p>
    </div>

    <!-- App Grid -->
    <div class="grid grid-cols-2 gap-4">
      
      <!-- Card: SOS Score (กดแล้วไปหน้าเลือกผู้ป่วย) -->
      <button onclick="switchPage('page-patient-list')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:shadow-md active:scale-95 transition text-left">
        <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
          <i class="fa-solid font-bold">SOS</i>
        </div>
        <div class="text-center">
          <h2 class="font-bold text-slate-800 text-base">SOS Score</h2>
          <p class="text-xs text-slate-400 mt-0.5">ประเมินความวิกฤตผู้ป่วย</p>
        </div>
      </button>
