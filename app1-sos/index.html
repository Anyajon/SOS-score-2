<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOS Score Mobile - TropMed</title>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ec4899">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fff1f3; touch-action: manipulation; }
        .input-focus:focus { outline: none; border-color: #ec4899; ring: 2px; ring-color: #fbcfe8; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-md mx-auto px-4 py-6 md:max-w-4xl">
        
        <!-- HEADER -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">Smart SOS Alert</h1>
            <p class="text-lg text-slate-600 mt-1">ประเมินสภาพผู้ป่วยที่มีอาการทรุดลงโดยใช้ SOS Score</p>
            
            <div class="inline-flex items-center bg-white border border-pink-100 rounded-full py-2 px-6 mt-4 shadow-sm">
                <i class="far fa-clock text-pink-500 mr-2"></i>
                <span id="clock" class="text-sm font-bold text-pink-600"></span>
            </div>
        </div>

        <!-- SEARCH / BED REGISTRY -->
        <div class="bg-white rounded-3xl shadow-md p-4 mb-6 border border-pink-50">
            <label class="block text-lg font-bold text-slate-700 mb-2 px-2">ค้นหาจากเลขห้อง/เตียง</label>
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <input type="text" id="roomInput" placeholder="ระบุเลขห้อง" 
                           class="w-full p-3 pl-10 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-pink-300 outline-none">
                    <i class="fas fa-bed absolute left-4 top-4 text-pink-300"></i>
                </div>
                <button onclick="searchByRoom()" class="bg-blue-500 text-white px-5 rounded-2xl active:scale-95 transition shadow-sm">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <!-- PATIENT INFO DISPLAY -->
            <div id="patientInfo" class="hidden mt-4 p-4 border border-blue-100 rounded-2xl bg-blue-50/50">
                <div class="flex justify-between items-start">
                    <div>
                        <p id="displayName" class="font-bold text-blue-900">-</p>
                        <p class="text-base text-blue-600">HN: <span id="displayHN">-</span> | ห้อง: <span id="displayRoom">-</span></p>
                    </div>
                    <button onclick="handleDischarge()" class="text-base bg-red-100 text-red-600 px-3 py-1 rounded-lg font-bold hover:bg-red-200 transition">จำหน่าย</button>
                </div>
            </div>

            <!-- EMPTY ROOM NOTICE -->
            <div id="emptyRoom" class="hidden mt-4 p-4 border-2 border-dashed border-gray-200 rounded-2xl text-center">
                <p class="text-base text-gray-500">ว่างอยู่? <span onclick="showAdmitForm()" class="text-blue-500 font-bold cursor-pointer underline">Admit คนใหม่</span></p>
            </div>
        </div>

        <!-- MAIN FORM -->
        <div class="bg-white rounded-[2.5rem] shadow-xl p-6 md:p-10 border border-pink-50 mb-10">
            <form id="sosForm" class="space-y-6">
                <!-- PERSONAL INFO -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-lg font-bold text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" name="name" id="nameInput" required 
                               class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-pink-200 transition">
                    </div>
                    <div>
                        <label class="block text-lg font-bold text-slate-700 mb-1">เลข HN</label>
                        <input type="text" name="hn" id="hnInput" required 
                               class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-pink-200 transition">
                    </div>
                </div>

                <!-- VITAL SIGNS INPUTS -->
                <div class="pt-4 border-t border-gray-50">
                    <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                        <i class="fas fa-heartbeat mr-2 text-pink-500"></i> สัญญาณชีพ
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 p-3 rounded-2xl">
                            <label class="block text-lg font-bold text-slate-500 uppercase">🌡️ Temp (°C)</label>
                            <input type="number" step="0.1" name="temp" oninput="calcScore()" class="w-full bg-transparent text-lg font-bold outline-none" placeholder="0.0">
                        </div>
                        <div class="bg-slate-50 p-3 rounded-2xl">
                            <label class="block text-lg font-bold text-slate-500 uppercase">🩸 SBP (mmHg)</label>
                            <input type="number" name="sbp" oninput="calcScore()" class="w-full bg-transparent text-lg font-bold outline-none" placeholder="0">
                        </div>
                        <div class="bg-slate-50 p-3 rounded-2xl">
                            <label class="block text-lg font-bold text-slate-500 uppercase">💓 Pulse (bpm)</label>
                            <input type="number" name="pulse" oninput="calcScore()" class="w-full bg-transparent text-lg font-bold outline-none" placeholder="0">
                        </div>
                        <div class="bg-slate-50 p-3 rounded-2xl">
                            <label class="block text-lg font-bold text-slate-500 uppercase">🫁 RR (/min)</label>
                            <input type="number" name="rr" oninput="calcScore()" class="w-full bg-transparent text-lg font-bold outline-none" placeholder="0">
                        </div>
                        <!-- URINE SECTION (App 1.1) -->
                        <div class="bg-slate-50/80 p-4 rounded-3xl border border-slate-100 space-y-3">
                            <label class="block text-lg font-bold text-slate-500 uppercase">🚽 Urine (ปริมาณปัสสาวะ)</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-lg text-slate-500 font-bold mr-2">ระยะเวลา (ชั่วโมง)</label>
                                    <!-- เปลี่ยนเป็น input number รับค่าได้ทุกตัวเลข -->
                                    <input type="number" step="0.5" min="0.1" name="urineHours" id="urineHours" value="8" oninput="calcScore()" 
                   class="w-full text-base font-bold outline-none bg-slate-50 border border-slate-200 rounded-lg p-1.5" placeholder="8">
                                </div>
                                <div>
                                    <label class="block text-lg text-slate-500 font-bold mr-2">ปริมาณรวม (ml)</label>
                                    <input type="number" name="urine" id="urineInput" oninput="calcScore()" 
                   class="w-full text-base font-bold outline-none bg-slate-50 border border-slate-200 rounded-lg p-1.5" placeholder="0">
                                </div>
                            </div>
                            <!-- แสดงค่าคำนวณเฉลี่ยเทียบ 8 ชม. ให้พยาบาลเห็น -->
                            <p id="urineCalculatedText" class="text-lg font-bold text-slate-500 text-right hidden">
                                เฉลี่ยเทียบเท่า 8 ชม.: <span id="urine8hrVal" class="text-pink-600">0</span> ml
                            </p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-2xl col-span-2">
                            <label class="block text-lg font-bold text-slate-500 uppercase">ความรู้สึกตัว</label>
                            <select name="con" onchange="calcScore()" class="w-full bg-transparent font-bold outline-none text-sm">
                                <option value="0">😊 ตื่นดี (รู้ตัว รู้เรื่อง)</option>
                                <option value="1">😕 สับสน (เพิ่งเกิด)</option>
                                <option value="1">😴 ซึม (เรียกแล้วลืมตาสะลึมสะลือ)</option>
                                <option value="2">😫 ซึมมาก (ต้องกระตุ้นจึงจะลืมตา)</option>
                                <option value="3">🌑 ไม่รู้สึกตัว (แม้กระตุ้นแล้ว)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SCORE DISPLAY -->
                <div id="scoreDisplay" class="p-5 rounded-3xl text-center bg-gray-100 transition-all duration-500">
                    <p class="text-xl font-bold uppercase tracking-widest mb-1">Total Score</p>
                    <div class="text-4xl font-black"><span id="totalScore">0</span></div>
                    <p class="text-xl mt-1">เกณฑ์ความเสี่ยง: <span id="riskLevel" class="font-bold">-</span></p>
                </div>
                
                <div id="guidelineText" class="text-lg text-center px-4 py-3 bg-white border border-gray-100 rounded-2xl italic text-slate-500">
                    กรุณากรอกข้อมูลสัญญาณชีพ
                </div>

                <!-- BUTTONS -->
                <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 rounded-2xl transition shadow-lg active:scale-95 text-lg">
                    <i class="fas fa-save mr-2"></i> บันทึกข้อมูล
                </button>
                
                <div class="flex gap-2">
                    <button type="button" onclick="searchData()" class="flex-1 bg-white text-slate-600 border border-slate-200 py-3 rounded-xl font-bold text-sm hover:bg-slate-50 transition">
                        <i class="fas fa-history mr-1"></i> ดูประวัติ HN
                    </button>
                    <button type="button" onclick="resetForm()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold text-sm hover:bg-slate-200 transition">
                        <i class="fas fa-redo mr-1"></i> ล้างฟอร์ม
                    </button>
                </div>
            </form>
        </div>

        <!-- HISTORY SECTION -->
        <div id="historySection" class="hidden mb-10 p-4 bg-white rounded-3xl shadow-lg border border-pink-50 overflow-hidden">
            <h3 class="font-bold text-lg mb-4 text-pink-600 px-2">ประวัติ 10 ครั้งล่าสุด (HN: <span id="searchHn"></span>)</h3>
            <div class="overflow-x-auto rounded-xl">
                <table class="w-full text-xs text-left border-collapse">
                    <thead class="bg-pink-50 text-pink-700">
                        <tr>
                            <th class="p-3">วัน/เวลา</th>
                            <th class="p-3 text-center">Score</th>
                            <th class="p-3">เกณฑ์</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody" class="text-slate-600 divide-y divide-pink-50"></tbody>
                </table>
            </div>
        </div>

        <footer class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest pb-10">
            TropMed, Ward 14
        </footer>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
    // --- 1. CONFIG & SYSTEM ---
    const gasUrl = "https://script.google.com/macros/s/AKfycbw8DZGydDsXnEvuIu7FAXarO2qsCxbAOCaPh5bUBNRfznbYU9i9JakzzuxwKz5kp_daXg/exec";
    const targetSpreadsheetId = "1Ic4a24ElFYxIh4DjOV3G0OUy23gAwx3eeUi9WMcDow8";

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString('th-TH', { 
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' 
        });
    }
    setInterval(updateClock, 1000);
    window.onload = () => { updateClock(); checkOfflineData(); };

    // --- 2. SEARCH & PATIENT MGMT ---
    function searchByRoom() {
        const room = document.getElementById('roomInput').value.trim();
        if (!room) return Swal.fire('ระบุเลขห้อง', 'กรุณากรอกเลขห้องก่อนค้นหา', 'warning');

        Swal.fire({ title: 'กำลังดึงข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        fetch(`${gasUrl}?action=getPatient&room=${encodeURIComponent(room)}&sheetId=${targetSpreadsheetId}`)
            .then(res => res.json())
            .then(patient => {
                Swal.close();
                if (patient && patient.hn) {
                    document.getElementById('patientInfo').classList.remove('hidden');
                    document.getElementById('emptyRoom').classList.add('hidden');
                    
                    document.getElementById('displayRoom').innerText = patient.room || room;
                    document.getElementById('displayName').innerText = patient.name || '-';
                    document.getElementById('displayHN').innerText = patient.hn || '-';
                    
                    document.getElementById('nameInput').value = patient.name || '';
                    document.getElementById('hnInput').value = patient.hn || '';
                    
                    Swal.fire({ icon: 'success', title: 'พบข้อมูลคนไข้', timer: 1000, showConfirmButton: false });
                } else {
                    document.getElementById('patientInfo').classList.add('hidden');
                    document.getElementById('emptyRoom').classList.remove('hidden');
                    Swal.fire('เตียงว่าง', 'ไม่มีคนไข้ในระบบ BedRegistry', 'info');
                }
            })
            .catch(() => Swal.fire('ผิดพลาด', 'เชื่อมต่อ Server ไม่ได้', 'error'));
    }

    function handleDischarge() {
        const hn = document.getElementById('displayHN').innerText;
        if (!hn || hn === '-') return;

        Swal.fire({
            title: 'จำหน่ายคนไข้?',
            text: `ยืนยันการ Discharge HN: ${hn}`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'ยืนยัน',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
                fetch(gasUrl, { 
                    method: "POST", 
                    body: JSON.stringify({ action: "discharge", hn: hn, sheetId: targetSpreadsheetId }) 
                })
                .then(() => Swal.fire('จำหน่ายแล้ว', '', 'success').then(() => location.reload()))
                .catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error'));
            }
        });
    }

    // --- 3. SOS SCORE CALCULATION ---
    function calcScore() {
        const f = document.getElementById('sosForm');
        let s = 0;
        
        // Temperature
        const temp = parseFloat(f.temp.value);
        if (!isNaN(temp)) {
            if (temp <= 35.0 || temp >= 38.5) s += 2;
            else if (temp <= 36.0 || (temp >= 38.1 && temp <= 38.4)) s += 1;
        }

        // Systolic BP
        const sbp = parseFloat(f.sbp.value);
        if (!isNaN(sbp)) {
            if (sbp <= 80) s += 3;
            else if (sbp <= 90 || sbp >= 200) s += 2;
            else if (sbp <= 100 || (sbp >= 181 && sbp <= 199)) s += 1;
        }

        // Pulse Rate
        const p = parseFloat(f.pulse.value);
        if (!isNaN(p)) {
            if (p <= 40 || p >= 140) s += 3;
            else if (p >= 121 && p <= 139) s += 2;
            else if ((p >= 41 && p <= 50) || (p >= 101 && p <= 120)) s += 1;
        }

        // Respiratory Rate
        const rr = parseFloat(f.rr.value);
        if (!isNaN(rr)) {
            if (rr <= 8 || rr >= 35) s += 3;
            else if (rr >= 26 && rr <= 34) s += 2;
            else if (rr >= 21 && rr <= 25) s += 1;
        }
       // --- URINE CALCULATION LOGIC ---
        const urineVal = parseFloat(f.urine.value);
       // ถ้าไม่ได้กรอกชั่วโมง ให้ Default ไว้ที่ 8 ชั่วโมง
        const urineHrs = parseFloat(f.urineHours.value) > 0 ? parseFloat(f.urineHours.value) : 8;

        const calcText = document.getElementById('urineCalculatedText');
        const display8hr = document.getElementById('urine8hrVal');

        if (!isNaN(urineVal) && urineVal >= 0) {
    // สูตรคำนวณ: (ปริมาณปัสสาวะ ÷ ชั่วโมงที่ระบุ) × 8
            const equiv8hr = (urineVal / urineHrs) * 8;
            // แสดงค่าเฉลี่ยแบบปัดเศษคำนวณง่าย
            display8hr.innerText = Math.round(equiv8hr);
            calcText.classList.remove('hidden');
            // ประเมินคะแนน SOS Score จากปริมาณเทียบเท่า 8 ชม.
            if (equiv8hr <= 160) {
                s += 2; // ออกน้อยมาก (<= 20 ml/hr)
            } else if (equiv8hr <= 319) {
                s += 1; // ออกค่อนข้างน้อย (20 - 40 ml/hr)
              }
        } else {
            calcText.classList.add('hidden');
}

        // Consciousness
        s += parseInt(f.con.value) || 0;

        document.getElementById('totalScore').innerText = s;

        // Risk Level & Guidelines Criteria
        let level = "Low", guide = "ติดตามผู้ป่วยตามปกติ, ประเมิน SOS Score ตามปกติ", color = "bg-green-100 text-green-700";
        if (s >= 4) { 
            level = "High"; 
            guide = "รายงานแพทย์ทันที! V/S ทุก 15-30 นาที"; 
            color = "bg-red-500 text-white"; 
        } else if (s >= 1) { 
            level = "Moderate"; 
            guide = "V/S ทุก 4 ชม., รายงาน In-charge เพื่อพิจารณารายงานแพทย์"; 
            color = "bg-yellow-400 text-slate-800"; 
        }

        const disp = document.getElementById('scoreDisplay');
        disp.className = `p-5 rounded-3xl text-center transition-all duration-500 ${color} shadow-inner`;
        document.getElementById('riskLevel').innerText = level;
        document.getElementById('guidelineText').innerText = guide;
        
        return { score: s, level: level, guide: guide };
    }

    // --- 4. SUBMIT DATA & OFFLINE ---
    document.getElementById('sosForm').onsubmit = function(e) {
        e.preventDefault();
        const res = calcScore();
        const formData = {
            sheetId: targetSpreadsheetId,
            room: document.getElementById('roomInput').value,
            name: this.name.value,
            hn: this.hn.value,
            temp: this.temp.value,
            sbp: this.sbp.value,
            pulse: this.pulse.value,
            rr: this.rr.value,
            urine: this.urine.value,
            con: this.con.options[this.con.selectedIndex].text,
            totalScore: res.score,
            riskLevel: res.level,
            guideline: res.guide
        };

        if (res.score >= 4) {
            Swal.fire({
                title: '🆘 High Score!',
                text: 'สาเหตุเกิดจาก Sepsis หรือไม่?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ใช่ (Sepsis)',
                cancelButtonText: 'ไม่ใช่'
            }).then((result) => {
                formData.isSepsis = result.isConfirmed ? "ใช่" : "ไม่ใช่";
                formData.sepsisAction = result.isConfirmed ? "ให้ปฏิบัติตาม Sepsis Flow" : "Monitor ทุก 15-30 นาที จน SOS<4/แพทย์บอกว่า stable then monitor ทุก 1 hr. อีก 4 hr./ SOS<4 then monitor ทุก 4 hr. จนครบ 24 hr.";
                sendToServer(formData);
            });
        } else {
            formData.isSepsis = "-";
            formData.sepsisAction = res.guide;
            sendToServer(formData);
        }
    };

    function sendToServer(data) {
        if (!navigator.onLine) {
            let queue = JSON.parse(localStorage.getItem('sos_offline_queue') || "[]");
            queue.push(data);
            localStorage.setItem('sos_offline_queue', JSON.stringify(queue));
            Swal.fire('Offline Mode', 'บันทึกลงเครื่องแล้ว ระบบจะซิงค์อัตโนมัติเมื่อเชื่อมต่ออินเทอร์เน็ต', 'info');
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
        fetch(gasUrl, { method: "POST", body: JSON.stringify(data) })
            .then(() => {
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
                resetForm();
            })
            .catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกไปยังฐานข้อมูลได้', 'error'));
    }

    // --- 5. HISTORY & UTILS ---
    function searchData() {
        const hn = document.getElementById('hnInput').value;
        if (!hn) return Swal.fire('โปรดระบุ HN ในช่องกรอกข้อมูล');
        
        Swal.fire({ title: 'กำลังค้นหาประวัติ...', didOpen: () => Swal.showLoading() });
        fetch(`${gasUrl}?hn=${encodeURIComponent(hn)}&sheetId=${targetSpreadsheetId}`)
            .then(res => res.json())
            .then(data => {
                Swal.close();
                const section = document.getElementById('historySection');
                section.classList.remove('hidden');
                section.scrollIntoView({ behavior: 'smooth' });
                document.getElementById('searchHn').innerText = hn;
                
                let html = '';
                if (Array.isArray(data) && data.length > 0) {
                    data.forEach(row => {
                        html += `<tr>
                            <td class="p-3">${row[0].split(' ')[1] || ''}<br><small class="text-gray-400">${row[0].split(' ')[0] || ''}</small></td>
                            <td class="p-3 text-center font-bold text-lg">${row[10] !== undefined ? row[10] : '-'}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] bg-slate-100 font-bold">${row[11] || '-'}</span></td>
                        </tr>`;
                    });
                }
                document.getElementById('historyBody').innerHTML = html || '<tr><td colspan="3" class="p-4 text-center text-gray-400">ไม่พบประวัติการบันทึก</td></tr>';
            })
            .catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถดึงข้อมูลประวัติได้', 'error'));
    }

    function checkOfflineData() {
        const queue = JSON.parse(localStorage.getItem('sos_offline_queue') || "[]");
        if (queue.length > 0 && navigator.onLine) {
            Swal.fire({
                title: 'พบข้อมูลค้างส่ง!',
                text: `คุณมีข้อมูล ${queue.length} รายการที่บันทึกช่วงออฟไลน์ ต้องการซิงค์ขึ้นระบบเลยไหม?`,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'ส่งข้อมูล',
                cancelButtonText: 'ไว้ทีหลัง'
            }).then(res => { if(res.isConfirmed) syncOffline(queue); });
        }
    }

    function syncOffline(queue) {
        if (queue.length === 0) { 
            localStorage.removeItem('sos_offline_queue'); 
            return Swal.fire('สำเร็จ', 'ซิงค์ข้อมูลออฟไลน์ทั้งหมดแล้ว', 'success'); 
        }
        const item = queue.shift();
        fetch(gasUrl, { method: "POST", body: JSON.stringify(item) })
            .then(() => syncOffline(queue))
            .catch(() => Swal.fire('ผิดพลาด', 'การซิงค์หยุดชะงัก โปรดลองใหม่อีกครั้ง', 'error'));
    }

    function resetForm() {
        document.getElementById('sosForm').reset();
        calcScore();
    }

    function showAdmitForm() { 
        document.getElementById('nameInput').focus(); 
    }
    </script>
</body>
</html>
