<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App 1 : SOS Score - TropMed Ward 14</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; touch-action: manipulation; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- ==========================================
         STEP 1 (App I) : หน้าค้นหาและระบุตัวผู้ป่วย
    =========================================== -->
    <div id="step-1" class="max-w-md mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-4">
            <!-- ปุ่มย้อนกลับไปหน้า Portal หลัก -->
            <a href="../index.html" class="text-slate-600 font-bold text-sm flex items-center">
                <i class="fas fa-chevron-left mr-1"></i> หน้าหลัก
            </a>
            <span class="text-xs font-bold text-slate-400">App 1 : SOS Score</span>
        </div>

        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">รู้เร็ว รู้ไว ด้วย SOS Score</h2>
            <p id="clock" class="text-xs font-bold text-pink-500 mt-1"></p>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-5 border border-slate-100 space-y-4">
            <h3 class="font-bold text-sm text-slate-700">ค้นหาจากเลขเตียง</h3>
            <div class="flex gap-2">
                <input type="text" id="roomInput" inputmode="numeric" placeholder="ระบุเลขห้อง" class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none">
                <button onclick="searchByRoom()" class="bg-blue-600 text-white px-4 rounded-2xl font-bold active:scale-95"><i class="fas fa-search"></i></button>
            </div>

            <div class="pt-2">
                <label class="block text-xs font-bold text-slate-500 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="nameInput" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">HN</label>
                <input type="text" id="hnInput" inputmode="numeric" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none">
            </div>

            <div class="flex gap-2 pt-4">
                <button onclick="searchHistory()" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-2xl font-bold text-sm active:scale-95">ดูประวัติ</button>
                <button onclick="goToStep2()" class="flex-1 bg-pink-500 text-white py-3 rounded-2xl font-bold text-sm shadow-md active:scale-95">ถัดไป <i class="fas fa-arrow-right ml-1"></i></button>
            </div>
        </div>

        <!-- กล่องประวัติการประเมิน -->
        <div id="historySection" class="hidden mt-4 p-4 bg-white rounded-3xl border border-slate-100">
            <h4 class="font-bold text-sm text-slate-700 mb-2">ประวัติการประเมิน</h4>
            <div id="historyBody" class="text-xs space-y-2"></div>
        </div>
    </div>


    <!-- ==========================================
         STEP 2 (App I.I) : หน้ากรอกสัญญาณชีพ
    =========================================== -->
    <div id="step-2" class="max-w-md mx-auto px-4 py-6 hidden">
        <div class="flex items-center justify-between mb-4">
            <button onclick="switchStep('step-1')" class="text-slate-600 font-bold text-sm flex items-center">
                <i class="fas fa-chevron-left mr-1"></i> ย้อนกลับ
            </button>
            <span class="text-xs font-bold text-slate-400">App I.I : สัญญาณชีพ</span>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-5 border border-slate-100 space-y-4">
            <div class="bg-pink-50 p-3 rounded-2xl text-xs font-bold text-pink-700 flex justify-between">
                <span id="summaryPatientName">ผู้ป่วย: -</span>
                <span id="summaryPatientHN">HN: -</span>
            </div>

            <h3 class="font-bold text-sm text-slate-800"><i class="fas fa-heartbeat text-pink-500 mr-1"></i> สัญญาณชีพ</h3>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <label class="block text-[11px] font-bold text-slate-500">Temp (°C)</label>
                    <input type="number" step="0.1" id="temp" inputmode="decimal" oninput="calcScore()" class="w-full bg-transparent font-bold text-lg outline-none" placeholder="0.0">
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <label class="block text-[11px] font-bold text-slate-500">SBP (mmHg)</label>
                    <input type="number" id="sbp" inputmode="numeric" oninput="calcScore()" class="w-full bg-transparent font-bold text-lg outline-none" placeholder="0">
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <label class="block text-[11px] font-bold text-slate-500">Pulse (/min)</label>
                    <input type="number" id="pulse" inputmode="numeric" oninput="calcScore()" class="w-full bg-transparent font-bold text-lg outline-none" placeholder="0">
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <label class="block text-[11px] font-bold text-slate-500">RR (/min)</label>
                    <input type="number" id="rr" inputmode="numeric" oninput="calcScore()" class="w-full bg-transparent font-bold text-lg outline-none" placeholder="0">
                </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-2xl">
                <label class="block text-[11px] font-bold text-slate-500 mb-1">Conscious (ความรู้สึกตัว)</label>
                <select id="con" onchange="calcScore()" class="w-full bg-transparent font-bold text-sm outline-none">
                    <option value="0">ตื่นดี (Alert)</option>
                    <option value="1">สับสน (Confusion)</option>
                    <option value="1">ซึม (Voice response)</option>
                    <option value="2">ซึมมาก (Pain response)</option>
                    <option value="3">ไม่รู้สึกตัว (Unresponsive)</option>
                </select>
            </div>

            <div class="bg-slate-50 p-3 rounded-2xl">
                <label class="block text-[11px] font-bold text-slate-500">Urine in 8 hr. (ml)</label>
                <input type="number" id="urine" inputmode="numeric" oninput="calcScore()" class="w-full bg-transparent font-bold text-lg outline-none" placeholder="0">
            </div>

            <!-- Total Score Box -->
            <div id="scoreBox" class="p-4 rounded-2xl text-center bg-slate-100 transition-all">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Total Score</span>
                <div class="text-3xl font-black my-1" id="totalScoreDisplay">0</div>
            </div>

            <button onclick="saveAndGoToStep3()" class="w-full bg-pink-500 text-white py-4 rounded-2xl font-bold text-sm shadow-md active:scale-95">
                บันทึกและแนวทางดูแล <i class="fas fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>


    <!-- ==========================================
         STEP 3 (App I.II) : หน้าแสดงผลและแนวทางปฏิบัติ
    =========================================== -->
    <div id="step-3" class="max-w-md mx-auto px-4 py-6 hidden">
        <div class="flex items-center justify-between mb-4">
            <button onclick="switchStep('step-2')" class="text-slate-600 font-bold text-sm flex items-center">
                <i class="fas fa-chevron-left mr-1"></i> แก้ไขข้อมูล
            </button>
            <span class="text-xs font-bold text-slate-400">App I.II : แนวทางดูแล</span>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 space-y-6 text-center">
            
            <div class="space-y-2">
                <h3 class="text-lg font-bold text-slate-800">SOS Score</h3>
                <div id="resultCircle" class="w-24 h-24 mx-auto rounded-full flex flex-col items-center justify-center font-black text-2xl shadow-inner bg-emerald-100 text-emerald-600">
                    <span id="finalScore">0</span>
                </div>
                <p id="finalRiskText" class="font-bold text-sm text-emerald-600">ไม่เสี่ยง / ความเสี่ยงต่ำ</p>
            </div>

            <hr class="border-slate-100">

            <div class="text-left space-y-3">
                <h4 class="font-bold text-sm text-slate-800">แนวทางการดำเนินการ</h4>
                <div id="guidelinesList" class="space-y-2 text-xs">
                    <!-- ข้อปฏิบัติต่างๆ จะถูกเพิ่มด้วย JavaScript -->
                </div>
            </div>

            <!-- ปุ่มเสร็จสิ้น กดแล้วพาข้ามกลับไปยังหน้า Portal หลักทันที -->
            <a href="../index.html" class="block w-full bg-slate-800 text-white py-3.5 rounded-2xl font-bold text-sm text-center active:scale-95">
                เสร็จสิ้น / กลับหน้าหลัก
            </a>
        </div>
    </div>

    <!-- เรียกใช้ไฟล์ Logic ของ App 1 -->
    <script src="app1.js"></script>
</body>
</html>
