<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TropMed Ward 14</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- เรียกใช้ Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- ตั้งค่า Meta tag สำหรับ iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="My App">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; touch-action: manipulation; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-md mx-auto px-4 py-8">
        <!-- Header หน้าหลัก -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-slate-800">TropMed Ward 14</h1>
            <p class="text-sm text-slate-500 mt-1">เลือกบริการ / Application ที่ต้องการ</p>
        </div>

        <!-- Grid เมนูแอปพลิเคชัน -->
        <div class="grid grid-cols-2 gap-4">
            
            <!-- App 1: SOS Score (เชื่อมไปยังโฟลเดอร์ app1-sos/) -->
            <a href="./app1-sos/" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col items-center text-center active:scale-95 transition">
                <div class="w-14 h-14 bg-pink-100 text-pink-500 rounded-2xl flex items-center justify-center text-xl mb-2 font-bold">SOS</div>
                <span class="font-bold text-slate-800 text-sm">App 1 : Smart SOS Alert</span>
                <span class="text-[10px] text-pink-500 font-semibold mt-1">แบบประเมินผู้ป่วยที่มีอาการทรุดลงด้วย SOS Score</span>
            </a>

            <!-- App 2: คำนวณยา (สำหรับอนาคต) -->
            <a href="#" onclick="Swal.fire('แจ้งเตือน', 'อยู่ระหว่างการพัฒนา', 'info')" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center text-center opacity-60">
                <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center text-xl mb-2">
                    <i class="fas fa-calculator"></i>
                </div>
                <span class="font-bold text-slate-700 text-sm">App 2 : คำนวณยา</span>
                <span class="text-[10px] text-slate-400 mt-1">Drug Calculator</span>
            </a>

            <!-- App 3: ตารางเวร + เบอร์ติดต่อ (สำหรับอนาคต) -->
            <a href="#" onclick="Swal.fire('แจ้งเตือน', 'อยู่ระหว่างการพัฒนา', 'info')" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center text-center opacity-60">
                <div class="w-14 h-14 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center text-xl mb-2">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <span class="font-bold text-slate-700 text-sm">App 3 : ตารางเวร</span>
                <span class="text-[10px] text-slate-400 mt-1">ตารางเวร + เบอร์ติดต่อ</span>
            </a>

            <!-- App 4: วิธีเก็บ Lab ส่งตรวจ (สำหรับอนาคต) -->
            <a href="#" onclick="Swal.fire('แจ้งเตือน', 'อยู่ระหว่างการพัฒนา', 'info')" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center text-center opacity-60">
                <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center text-xl mb-2">
                    <i class="fas fa-vial"></i>
                </div>
                <span class="font-bold text-slate-700 text-sm">App 4 : เก็บ Lab</span>
                <span class="text-[10px] text-slate-400 mt-1">วิธีเก็บ Lab ส่งตรวจ</span>
            </a>

        </div>
    </div>

</body>
</html>
